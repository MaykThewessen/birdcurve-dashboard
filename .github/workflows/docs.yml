name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/sphinx/**"
      - "dashboard/backend/app/**"
      - ".github/workflows/docs.yml"
      - "README.md"
  pull_request:
    paths:
      - "docs/sphinx/**"
      - "dashboard/backend/app/**"
      - ".github/workflows/docs.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: docs/sphinx/requirements.txt

      - name: Install Sphinx + extensions
        run: pip install -r docs/sphinx/requirements.txt

      - name: Build HTML
        env:
          DOCS_RELEASE: ${{ github.ref_name }}
        run: |
          sphinx-build -b html -W --keep-going -n docs/sphinx docs/sphinx/_build/html

      - name: Add .nojekyll
        run: touch docs/sphinx/_build/html/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/sphinx/_build/html

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: docs-html
          path: docs/sphinx/_build/html
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
